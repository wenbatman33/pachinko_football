<body>
<div id="app"></div>
<!-- 載入畫面：首頁的主視覺與標誌（位置跟首頁一樣，載完直接淡出接上首頁）＋漫畫風進度條。樣式在 css/style.css -->
<div id="loading">
  <div class="ld-card">
    <img class="ld-art" src="assets/img/home_bg.webp" alt="" onload="this.classList.add('on')">
    <div class="ld-shade"></div>
    <div class="ld-rays"></div>
    <img class="ld-logo" src="assets/img/logo.webp" alt="PK大逆转" onload="this.classList.add('on')">
    <div class="ld-box">
      <div class="ld-text"><span>加载中</span><b id="loadPct">0%</b></div>
      <div class="load-track"><div id="loadBar"><i class="ld-ball"></i></div></div>
    </div>
  </div>
</div>

<!-- DEV 開發者微調工具（D 鍵或右下角齒輪） -->
<button id="devToggle" title="DEV (D)">⚙</button>
<div id="devPanel">
  <div class="dev-head">DEV 微调工具 <button id="devClose">✕</button></div>
  <div id="devTabs"></div>
  <div id="devBody"></div>
</div>

<!-- 正式版（2026-11-10 起）：真實比例物理（js/v2/）＋新樣式的機台。舊版保留在 classic.html。
     正式版用自己的存檔（鍵名前面加 v2_），不會動到舊版的珠數、手把位置與開發工具微調；漫畫進度與音量兩版共用 -->
<script>
(function () {
  var SP = Storage.prototype, g = SP.getItem, s = SP.setItem, r = SP.removeItem;
  function k(n) { return /^pk_/.test(n) && n !== 'pk_manga' && n !== 'pk_volume' && n !== 'pk_muted' ? 'v2_' + n : n; }
  SP.getItem = function (n) { return g.call(this, k(n)); };
  SP.setItem = function (n, v) { return s.call(this, k(n), v); };
  SP.removeItem = function (n) { return r.call(this, k(n)); };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
