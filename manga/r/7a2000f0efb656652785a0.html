<script>window.CHAPTER = {"id": "ch02", "no": 2, "title": "亚洲杯的第七十分钟", "free": false, "next": "第三话〈高原的冬天〉", "items": [{"id": "p00", "size": "1024x1536", "lines": [], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p00.webp"}, {"id": "p01", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "亚洲杯。小组赛最后一轮。"}, {"type": "nar", "at": "after", "text": "对手，日本。"}, {"type": "nar", "at": "after", "text": "赢，出线。输，回家。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p01.webp"}, {"id": "p02", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "球员通道。"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（亚洲最好的中场——就在旁边。）"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p02.webp"}, {"id": "p03", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "神崎凛。二十四岁。"}, {"type": "nar", "at": "after", "text": "上一届亚洲杯，传球成功率百分之九十四。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p03.webp"}, {"id": "p04", "size": "1536x1024", "lines": [{"type": "say", "who": "韩铮", "side": "l", "at": "after", "text": "九十分钟。一步都别让。"}, {"type": "say", "who": "队友们", "side": "r", "at": "after", "text": "是！"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p04.webp"}, {"id": "p05", "size": "1536x1024", "lines": [], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p05.webp"}, {"id": "p06", "size": "1536x1024", "lines": [{"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "陆远。你的任务只有一个。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "接球，转身，往前传。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "明白。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p06.webp"}, {"id": "p07", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "比赛开始。"}], "sfx": [{"text": "哔——！", "x": 0.15, "y": 0.12, "size": 1.2, "rot": -6}], "img": "../img/7a2000f0efb656652785a0/p07.webp"}, {"id": "p08", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "开场十分钟，日本队控球率七成。"}, {"type": "shout", "who": "韩铮", "side": "r", "at": "after", "text": "保持距离！别被拉开！"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p08.webp"}, {"id": "p09", "size": "1536x1024", "lines": [], "sfx": [{"text": "唰！", "x": 0.84, "y": 0.13, "size": 1.1, "rot": 8}], "img": "../img/7a2000f0efb656652785a0/p09.webp"}, {"id": "p10", "size": "1536x1024", "lines": [{"type": "shout", "who": "周牧", "side": "l", "at": "after", "text": "陆远！"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p10.webp"}, {"id": "p11", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（右边两个人。中间——有缝。）"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p11.webp"}, {"id": "p12", "size": "1536x1024", "lines": [], "sfx": [{"text": "嘭——！", "x": 0.82, "y": 0.14, "size": 1.3, "rot": 6}], "img": "../img/7a2000f0efb656652785a0/p12.webp"}, {"id": "p13", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "四十米。一脚穿透了整条防线。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p13.webp"}, {"id": "p14", "size": "1536x1024", "lines": [], "sfx": [{"text": "啪！", "x": 0.15, "y": 0.13, "size": 1.1, "rot": -8}], "img": "../img/7a2000f0efb656652785a0/p14.webp"}, {"id": "p15", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第十八分钟。全场第一次射门，只差一个指尖。"}, {"type": "say", "who": "艾尔肯", "side": "r", "at": "after", "text": "好球！再来！"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p15.webp"}, {"id": "p16", "size": "1536x1024", "lines": [{"type": "think", "who": "神崎凛", "side": "r", "at": "after", "text": "（左脚。出球之前，眼睛先往右看。）"}, {"type": "think", "who": "神崎凛", "side": "r", "at": "after", "text": "（转身，需要一步半。）"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p16.webp"}, {"id": "p17", "size": "1536x1024", "lines": [{"type": "say", "who": "神崎凛", "side": "l", "at": "after", "text": "压住他的左侧。"}, {"type": "say", "who": "神崎凛", "side": "l", "at": "after", "text": "他接球的那一刻，线路要已经没有了。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p17.webp"}, {"id": "p18", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（线路——没了？）"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p18.webp"}, {"id": "p19", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "他只能回传。一次。两次。五次。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p19.webp"}, {"id": "p20", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "而神崎凛的每一脚传球，都落在队友最舒服的那只脚上。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p20.webp"}, {"id": "p21", "size": "1536x1024", "lines": [{"type": "shout", "who": "石磊", "side": "l", "at": "after", "text": "我的！"}], "sfx": [{"text": "砰！", "x": 0.84, "y": 0.86, "size": 1.2, "rot": -6}], "img": "../img/7a2000f0efb656652785a0/p21.webp"}, {"id": "p22", "size": "1536x1024", "lines": [{"type": "shout", "who": "韩铮", "side": "r", "at": "after", "text": "顶住！"}], "sfx": [{"text": "咚！", "x": 0.15, "y": 0.13, "size": 1.2, "rot": -8}], "img": "../img/7a2000f0efb656652785a0/p22.webp"}, {"id": "p23", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "上半场结束。0比0。"}, {"type": "nar", "at": "after", "text": "陆远的跑动距离，全队第一。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p23.webp"}, {"id": "p24", "size": "1536x1024", "lines": [{"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "他们在封陆远的左侧线路。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "周牧，你往前提五米，给他一个出球点。"}, {"type": "say", "who": "周牧", "side": "r", "at": "after", "text": "明白。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p24.webp"}, {"id": "p25", "size": "1536x1024", "lines": [{"type": "think", "who": "林晚", "side": "r", "at": "after", "text": "（上半场，冲刺二十一次。）"}, {"type": "think", "who": "林晚", "side": "r", "at": "after", "text": "（按这个节奏，他撑不到最后。）"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p25.webp"}, {"id": "p26", "size": "1536x1024", "lines": [{"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "腿怎么样？"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "没问题。"}, {"type": "nar", "at": "after", "text": "他握着水瓶的手，在抖。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p26.webp"}, {"id": "p27", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "下半场。日本队提速了。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p27.webp"}, {"id": "p28", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "神崎凛只触了一次球。陆远扑了个空。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p28.webp"}, {"id": "p29", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第五十五分钟。"}], "sfx": [{"text": "呼——呼——", "x": 0.8, "y": 0.13, "size": 1.0, "rot": 4}], "img": "../img/7a2000f0efb656652785a0/p29.webp"}, {"id": "p30", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "腿，开始变重。"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（每一步，都像踩在沙子里。）"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p30.webp"}, {"id": "p31", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第六十二分钟。神崎凛的直塞。"}, {"type": "nar", "at": "after", "text": "0比1。"}], "sfx": [{"text": "唰——", "x": 0.83, "y": 0.12, "size": 1.1, "rot": 6}], "img": "../img/7a2000f0efb656652785a0/p31.webp"}, {"id": "p32", "size": "1536x1024", "lines": [{"type": "shout", "who": "韩铮", "side": "r", "at": "after", "text": "还有时间！都给我站起来！"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p32.webp"}, {"id": "p33", "size": "1536x1024", "lines": [{"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "顾指导。陆远的冲刺速度，掉了一成半。"}, {"type": "say", "who": "顾长河", "side": "r", "at": "after", "text": "……再等五分钟。我们需要他那一脚。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p33.webp"}, {"id": "p34", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第六十八分钟。"}, {"type": "think", "who": "陆远", "side": "c", "at": "after", "text": "（看不清了。远处的人，是红的还是蓝的？）"}], "sfx": [{"text": "咚、咚、", "x": 0.16, "y": 0.14, "size": 1.0, "rot": -4}], "img": "../img/7a2000f0ef  "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "亚洲杯，小组出局。"}], "sfx": [{"text": "哔——哔——哔——！", "x": 0.22, "y": 0.12, "size": 1.1, "rot": -4}], "img": "../img/7a2000f0efb656652785a0/p45.webp"}, {"id": "p46", "size": "1536x1024", "lines": [{"type": "say", "who": "球迷", "side": "r", "at": "after", "text": "……又是这样。"}, {"type": "nar", "at": "after", "text": "几千名远道而来的球迷，没有一个人提前离场。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p46.webp"}, {"id": "p47", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "更衣室里，没有人说话。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p47.webp"}, {"id": "p48", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "韩铮把袖标攥在手里，攥了很久。"}, {"type": "think", "who": "韩铮", "side": "r", "at": "after", "text": "（我的，最后一届亚洲杯。）"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p48.webp"}, {"id": "p49", "size": "1536x1024", "lines": [{"type": "say", "who": "艾尔肯", "side": "l", "at": "after", "text": "……那个单刀，我该进的。"}, {"type": "say", "who": "韩铮", "side": "r", "at": "after", "text": "不是哪一个人的事。"}, {"type": "say", "who": "韩铮", "side": "r", "at": "after", "text": "抬起头，走出去。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p49.webp"}, {"id": "p50", "size": "1536x1024", "lines": [{"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "第七十分钟。我喊了你。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "……我听见了。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "腿没跟上。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p50.webp"}, {"id": "p51", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "混合区。"}, {"type": "say", "who": "记者", "side": "r", "at": "after", "text": "陆远，能谈谈那次丢球吗？"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p51.webp"}, {"id": "p52", "size": "1536x1024", "lines": [{"type": "say", "who": "神崎凛", "side": "r", "at": "after", "text": "陆远。"}], "sfx": [], "img": "../img/7a2000f0efb656652785a0/p52.webp"}, {"id": "p53", "si
