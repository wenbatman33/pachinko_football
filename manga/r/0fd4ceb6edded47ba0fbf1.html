<script>window.CHAPTER = {"id": "ch03", "no": 3, "title": "高原的冬天", "free": false, "next": "第四话〈最后一轮〉", "items": [{"id": "p00", "size": "1024x1536", "lines": [], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p00.webp"}, {"id": "p01", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "十二月。高原训练基地。"}, {"type": "nar", "at": "after", "text": "海拔两千二百米。空气里的氧气，比平原少两成。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p01.webp"}, {"id": "p02", "size": "1536x1024", "lines": [{"type": "say", "who": "艾尔肯", "side": "l", "at": "after", "text": "空气真薄。"}, {"type": "say", "who": "韩铮", "side": "r", "at": "after", "text": "所以才来这儿。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p02.webp"}, {"id": "p03", "size": "1536x1024", "lines": [{"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "这是你的冬训方案。六周，三件事。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p03.webp"}, {"id": "p04", "size": "1536x1024", "lines": [{"type": "say", "who": "林晚", "side": "c", "at": "after", "text": "第一，高原折返跑。把有氧的底子垫高。"}, {"type": "say", "who": "林晚", "side": "c", "at": "after", "text": "第二，对抗力量。每周四次。"}, {"type": "say", "who": "林晚", "side": "c", "at": "after", "text": "第三，任意球。每天加练三百个。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p04.webp"}, {"id": "p05", "size": "1536x1024", "lines": [{"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "三百个，我一直在练。"}, {"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "不一样。放在全天训练的最后踢。"}, {"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "我要练的，是你最累时候的那一脚。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p05.webp"}, {"id": "p06", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第一天。"}], "sfx": [{"text": "哔！", "x": 0.14, "y": 0.13, "size": 1.1, "rot": -6}], "img": "../img/0fd4ceb6edded47ba0fbf1/p06.webp"}, {"id": "p07", "size": "1536x1024", "lines": [], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p07.webp"}, {"id": "p08", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第六组。心率一百八十七。"}], "sfx": [{"text": "呼——呼——", "x": 0.8, "y": 0.13, "size": 1.0, "rot": 4}], "img": "../img/0fd4ceb6edded47ba0fbf1/p08.webp"}, {"id": "p09", "size": "1536x1024", "lines": [{"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "休息四十秒。还有四组。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "……好。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p09.webp"}, {"id": "p10", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第一周，他每天都跑到跪在地上。"}, {"type": "nar", "at": "after", "text": "没有一天少跑一组。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p10.webp"}, {"id": "p11", "size": "1536x1024", "lines": [{"type": "say", "who": "韩铮", "side": "r", "at": "after", "text": "腰收紧。再来两个。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p11.webp"}, {"id": "p12", "size": "1536x1024", "lines": [], "sfx": [{"text": "砰！", "x": 0.84, "y": 0.13, "size": 1.2, "rot": 8}], "img": "../img/0fd4ceb6edded47ba0fbf1/p12.webp"}, {"id": "p13", "size": "1536x1024", "lines": [{"type": "say", "who": "韩铮", "side": "l", "at": "after", "text": "重心再低。用髋去顶，不是用肩。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "再来。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p13.webp"}, {"id": "p14", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "傍晚。全队收队以后。"}, {"type": "nar", "at": "after", "text": "三百个任意球，从这时候才开始。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p14.webp"}, {"id": "p15", "size": "1536x1024", "lines": [], "sfx": [{"text": "嘭！", "x": 0.82, "y": 0.14, "size": 1.2, "rot": 6}], "img": "../img/0fd4ceb6edded47ba0fbf1/p15.webp"}, {"id": "p16", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（支撑脚在抖。）"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（那就踢到它不抖为止。）"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p16.webp"}, {"id": "p17", "size": "1536x1024", "lines": [{"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "一个人练，练不出对抗。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p17.webp"}, {"id": "p18", "size": "1536x1024", "lines": [{"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "一对一。我防你。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "……为什么？"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p18.webp"}, {"id": "p19", "size": "1536x1024", "lines": [{"type": "say", "who": "周牧", "side": "c", "at": "after", "text": "对日本那场，第七十分钟，我喊了你。"}, {"type": "say", "who": "周牧", "side": "c", "at": "after", "text": "光喊没有用。"}, {"type": "say", "who": "周牧", "side": "c", "at": "after", "text": "我得让你在那个时候，还转得过身。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p19.webp"}, {"id": "p20", "size": "1536x1024", "lines": [], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p20.webp"}, {"id": "p21", "size": "1536x1024", "lines": [{"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "你护球只用左脚。太好猜了。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "再来。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p21.webp"}, {"id": "p22", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第十次。第三十次。"}, {"type": "nar", "at": "after", "text": "被断下的次数，一晚比一晚少。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p22.webp"}, {"id": "p23", "size": "1536x1024", "lines": [], "sfx": [{"text": "唰！", "x": 0.84, "y": 0.13, "size": 1.1, "rot": 8}], "img": "../img/0fd4ceb6edded47ba0fbf1/p23.webp"}, {"id": "p24", "size": "1536x1024", "lines": [{"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "当年梯队留下的是我。"}, {"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "可这八年，我没有一天像你这样练过。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "明天，还是这个时间？"}, {"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "嗯。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p24.webp"}, {"id": "p25", "size": "1536x1024", "lines": [{"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "伊朗的中卫，卡维。争顶成功率八成。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "他习惯在你接球的瞬间上身体。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "提前半步，先把自己靠上去。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p25.webp"}, {"id": "p26", "size": "1536x1024", "lines": [{"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "近点三个人，韩铮包后点。再来。"}, {"type": "nar", "at": "after", "text": "同一个角球战术，一上午演练了四十遍。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p26.webp"}, {"id": "p27", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "每一餐，按克称重。"}, {"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "蛋白质再加三十克。你的体重，要上去两公斤。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p27.webp"}, {"id": "p28", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "晚上十点熄灯。睡眠数据，第二天早上汇总。"}, {"type": "nar", "at": "after", "text": "没有捷径。只有重复。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p28.webp"}, {"id": "p29", "size": "1536x1024", "lines": [{"type": "think", "who": "林晚", "side": "r", "at": "after", "text": "（第十组，和第一组只差零点三秒。）"}, {"type": "say", "who": "林晚", "side": "r", "at": "after", "text": "可以了。"}, {"type": "say", "who": "林晚", "side": "r", "at": "after", "text": "去踢比赛吧。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p29.webp"}, {"id": "p30", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "三月。世界杯预选赛，客场对伊朗。"}, {"type": "nar", "at": "after", "text": "高原上的球场，八万名主队球迷。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p30.webp"}, {"id": "p31", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "中国队刚走出通道，嘘声就盖过了一切。"}], "sfx": [{"text": "嘘——！！", "x": 0.8, "y": 0.12, "size": 1.3, "rot": 5}], "img": "../img/0fd4ceb6edded47ba0fbf1/p31.webp"}, {"id": "p32", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "雷扎·卡维。"}, {"type": "nar", "at": "after", "text": "亚洲最强的防空塔。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p32.webp"}, {"id": "p33", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第十二分钟。第一次。"}], "sfx": [{"text": "砰！！", "x": 0.15, "y": 0.13, "size": 1.3, "rot": -8}], "img": "../img/0fd4ceb6edded47ba0fbf1/p33.webp"}, {"id": "p34", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（好重。比录像里更快。）"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p34.webp"}, {"id": "p35", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第三十九分钟。第二次。"}], "sfx": [{"text": "咚！", "x": 0.84, "y": 0.13, "size": 1.2, "rot": 8}], "img": "../img/0fd4ceb6edded47ba0fbf1/p35.webp"}, {"id": "p36", "size": "1536x1024", "lines": [{"type": "say", "who": "韩铮", "side": "l", "at": "after", "text": "还行吗？"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "行。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "他上身体之前，左肩会先沉一下。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p36.webp"}, {"id": "p37", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "下半场，伊朗队全线压上。"}, {"type": "shout", "who": "石磊", "side": "r", "at": "after", "text": "我的！"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p37.webp"}, {"id": "p38", "size": "1536x1024", "lines": [{"type": "shout", "who": "周牧", "side": "l", "at": "after", "text": "陆远！背后！"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p38.webp"}, {"id": "p39", "size": "1024x1536", "lines": [{"type": "nar", "at": "before", "text": "第七十四分钟。第三次。"}], "sfx": [{"text": "砰——！！", "x": 0.3, "y": 0.06, "size": 1.3, "rot": -6}], "img": "../img/0fd4ceb6edded47ba0fbf1/p39.webp"}, {"id": "p40", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "这一次，他没有倒。"}, {"type": "nar", "at": "after", "text": "球，还在脚下。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p40.webp"}, {"id": "p41", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "0比0。"}, {"type": "nar", "at": "after", "text": "从亚 fbf1/p50.webp"}, {"id": "p51", "size": "1536x1024", "lines": [{"type": "shout", "who": "陆远", "side": "l", "at": "after", "text": "艾尔肯！"}], "sfx": [{"text": "嘭——！", "x": 0.15, "y": 0.13, "size": 1.3, "rot": -6}], "img": "../img/0fd4ceb6edded47ba0fbf1/p51.webp"}, {"id": "p52", "size": "1536x1024", "lines": [], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p52.webp"}, {"id": "p53", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "2比1。绝杀。"}], "sfx": [{"text": "唰——！！", "x": 0.82, "y": 0.12, "size": 1.3, "rot": 6}], "img": "../img/0fd4ceb6edded47ba0fbf1/p53.webp"}, {"id": "p54", "size": "1536x1024", "lines": [{"type": "shout", "who": "艾尔肯", "side": "l", "at": "after", "text": "陆远——！"}, {"type": "nar", "at": "after", "text": "第八十五分钟的那一脚，和第十五分钟一样准。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p54.webp"}, {"id": "p55", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "积分榜上，中国队第一次进入出线区。"}, {"type": "say", "who": "韩铮", "side": "l", "at": "after", "text": "还没完。还有两轮。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p55.webp"}, {"id": "p56", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "倒数第二轮。第八十一分钟，1比0领先。"}], "sfx": [{"text": "咚！", "x": 0.15, "y": 0.13, "size": 1.2, "rot": -8}], "img": "../img/0fd4ceb6edded47ba0fbf1/p56.webp"}, {"id": "p57", "size": "1536x1024", "lines": [{"type": "shout", "who": "陆远", "side": "r", "at": "after", "text": "队长！"}], "sfx": [{"text": "咔——", "x": 0.84, "y": 0.14, "size": 1.0, "rot": 6}], "img": "../img/0fd4ceb6edded47ba0fbf1/p57.webp"}, {"id": "p58", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "右膝。旧伤的位置。"}, {"type": "say", "who": "队医", "side": "l", "at": "after", "text": "别动！担架！"}, {"type": "nar", "at": "after", "text": "那场比赛守住了。队长，没能自己走下场。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p58.webp"}, {"id": "p59", "size": "1024x1536", "lines": [{"type": "say", "who": "韩铮", "side": "r", "at": "after", "text": "最后一场。"}, {"type": "say", "who": "韩铮", "side": "r", "at": "after", "text": "替我踢完。"}, {"type": "nar", "at": "after", "text": "最后一轮，对手是韩国。"}, {"type": "nar", "at": "after", "text": "只有赢，才能去世界杯。"}], "sfx": [], "img": "../img/0fd4ceb6edded47ba0fbf1/p59.webp"}], "hasNext": true};</script>
