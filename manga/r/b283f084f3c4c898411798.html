<script>window.CHAPTER = {"id": "ch04", "no": 4, "title": "最后一轮", "free": false, "next": "第五话〈世界的草皮〉", "items": [{"id": "p00", "size": "1024x1536", "lines": [], "sfx": [], "img": "../img/b283f084f3c4c898411798/p00.webp"}, {"id": "p01", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "世界杯预选赛，最后一轮。"}, {"type": "nar", "at": "before", "text": "主场，对韩国。"}, {"type": "nar", "at": "after", "text": "六万人。只有赢，才能出线。"}], "sfx": [], "img": "../img/b283f084f3c4c898411798/p01.webp"}, {"id": "p02", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "韩铮的袖标，今晚在他的手臂上。"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（最后一场。替你踢完。）"}], "sfx": [], "img": "../img/b283f084f3c4c898411798/p02.webp"}, {"id": "p03", "size": "1536x1024", "lines": [{"type": "say", "who": "姜泰俊", "side": "r", "at": "after", "text": "平局，出线的就是我们。"}, {"type": "say", "who": "姜泰俊", "side": "r", "at": "after", "text": "但我们是来赢的。"}, {"type": "say", "who": "陆远", "side": "l", "at": "after", "text": "我们也是。"}], "sfx": [], "img": "../img/b283f084f3c4c898411798/p03.webp"}, {"id": "p04", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "比赛开始。"}], "sfx": [{"text": "哔——！", "x": 0.15, "y": 0.12, "size": 1.1, "rot": -6}], "img": "../img/b283f084f3c4c898411798/p04.webp"}, {"id": "p05", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "韩国队从第一分钟起，全场紧逼。"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（出不了球——！）"}], "sfx": [], "img": "../img/b283f084f3c4c898411798/p05.webp"}, {"id": "p06", "size": "1536x1024", "lines": [], "sfx": [{"text": "砰！", "x": 0.84, "y": 0.12, "size": 1.2, "rot": 8}], "img": "../img/b283f084f3c4c898411798/p06.webp"}, {"id": "p07", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第九分钟。0比1。"}], "sfx": [], "img": "../img/b283f084f3c4c898411798/p07.webp"}, {"id": "p08", "size": "1536x1024", "lines": [{"type": "shout", "who": "陆远", "side": "c", "at": "after", "text": "别低头！回
