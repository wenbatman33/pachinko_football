<script>window.CHAPTER = {"id": "ch05", "no": 5, "title": "世界的草皮", "free": false, "next": "第六话・敬请期待", "items": [{"id": "p00", "size": "1024x1536", "lines": [], "sfx": [], "img": "../img/9b675c109795163a404adf/p00.webp"}, {"id": "p01", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "世界杯。"}, {"type": "nar", "at": "after", "text": "中国队，回到了这里。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p01.webp"}, {"id": "p02", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "小组赛第一场。对手，德国。"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（这就是，世界的草皮。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p02.webp"}, {"id": "p03", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "卢卡斯·布兰特。世界最好的门将。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p03.webp"}, {"id": "p04", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（快。每一脚传球，都比亚洲快半拍。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p04.webp"}, {"id": "p05", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第十四分钟。0比1。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p05.webp"}, {"id": "p06", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（刚抬头，人已经到了——！）"}], "sfx": [{"text": "砰！", "x": 0.84, "y": 0.12, "size": 1.1, "rot": 6}], "img": "../img/9b675c109795163a404adf/p06.webp"}, {"id": "p07", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第五十一分钟。角球，头球。0比2。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p07.webp"}, {"id": "p08", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第六十三分钟。禁区前，任意球。"}], "sfx": [{"text": "哔——！", "x": 0.15, "y": 0.12, "size": 1.1, "rot": -6}], "img": "../img/9b675c109795163a404adf/p08.webp"}, {"id": "p09", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（和那一晚一样的距离。左上角。）"}, {"type": "think", "who": "布兰特", "side": "r", "at": "after", "text": "（左脚。会绕人墙外侧。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p09.webp"}, {"id": "p10", "size": "1536x1024", "lines": [], "sfx": [{"text": "嘭——！", "x": 0.84, "y": 0.13, "size": 1.3, "rot": 6}], "img": "../img/9b675c109795163a404adf/p10.webp"}, {"id": "p11", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "弧线，落点，都和绝杀那一脚一样。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p11.webp"}, {"id": "p12", "size": "1536x1024", "lines": [], "sfx": [{"text": "啪——！", "x": 0.16, "y": 0.86, "size": 1.3, "rot": -6}], "img": "../img/9b675c109795163a404adf/p12.webp"}, {"id": "p13", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（……够到了？）"}, {"type": "nar", "at": "after", "text": "单掌。指尖，把球托出了横梁。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p13.webp"}, {"id": "p14", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "0比2。终场。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p14.webp"}, {"id": "p15", "size": "1536x1024", "lines": [{"type": "say", "who": "布兰特", "side": "r", "at": "after", "text": "好球。"}, {"type": "say", "who": "布兰特", "side": "r", "at": "after", "text": "再往外五厘米，我就够不到了。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p15.webp"}, {"id": "p16", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "c", "at": "after", "text": "（五厘米。）"}, {"type": "think", "who": "陆远", "side": "c", "at": "after", "text": "（世界，就在那五厘米外面。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p16.webp"}, {"id": "p17", "size": "1536x1024", "lines": [{"type": "say", "who": "林晚", "side": "r", "at": "after", "text": "他们的出球，平均比我们快零点四秒。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "输给世界第一，不丢人。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "丢人的是，下一场还输在同一个地方。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p17.webp"}, {"id": "p18", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "那天夜里，本子上又多了一行。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p18.webp"}, {"id": "p19", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第二场，对乌拉圭。"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（接球之前，先看好下一脚。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p19.webp"}, {"id": "p20", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第三十分钟，0比1。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p20.webp"}, {"id": "p21", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第七十四分钟。陆远一脚出球，艾尔肯推射远角。"}, {"type": "nar", "at": "after", "text": "1比1。世界杯上的第一个积分。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p21.webp"}, {"id": "p22", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第三场，对美国。"}, {"type": "nar", "at": "after", "text": "赢，就出线。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p22.webp"}, {"id": "p23", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第六十七分钟。陆远的角球，周牧头球。1比0。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p23.webp"}, {"id": "p24", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第八十八分钟。点球。"}], "sfx": [{"text": "哔——！", "x": 0.84, "y": 0.12, "size": 1.2, "rot": 6}], "img": "../img/9b675c109795163a404adf/p24.webp"}, {"id": "p25", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "每场比赛前，他都会一个人摸一遍两根门柱。"}, {"type": "think", "who": "石磊", "side": "l", "at": "after", "text": "（这扇门，我守了二十年。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p25.webp"}, {"id": "p26", "size": "1536x1024", "lines": [], "sfx": [{"text": "啪——！", "x": 0.15, "y": 0.12, "size": 1.3, "rot": -8}], "img": "../img/9b675c109795163a404adf/p26.webp"}, {"id": "p27", "size": "1536x1024", "lines": [{"type": "shout", "who": "解说", "side": "c", "at": "after", "text": "扑出去了！石磊！"}, {"type": "nar", "at": "after", "text": "1比0。中国队，历史上第一次小组出线。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p27.webp"}, {"id": "p28", "size": "1536x1024", "lines": [{"type": "say", "who": "周牧", "side": "l", "at": "after", "text": "十六强，日本。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "嗯。"}, {"type": "think", "who": "陆远", "side": "r", "at": "after", "text": "（“你的左脚很好，但只有七十分钟。”）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p28.webp"}, {"id": "p29", "size": "1536x1024", "lines": [{"type": "say", "who": "神崎凛", "side": "r", "at": "after", "text": "又见面了。"}, {"type": "say", "who": "陆远", "side": "l", "at": "after", "text": "这一次，我会跑到最后。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p29.webp"}, {"id": "p30", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "十六强。中国对日本。"}, {"type": "nar", "at": "after", "text": "神崎凛，依然是场上最清醒的人。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p30.webp"}, {"id": "p31", "size": "1536x1024", "lines": [{"type": "think", "who": "神崎凛", "side": "r", "at": "after", "text": "（不一样了。他不再等球。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p31.webp"}, {"id": "p32", "size": "1536x1024", "lines": [], "sfx": [{"text": "嘭——！", "x": 0.84, "y": 0.12, "size": 1.2, "rot": 6}], "img": "../img/9b675c109795163a404adf/p32.webp"}, {"id": "p33", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第三十八分钟。0比1。"}, {"type": "nar", "at": "after", "text": "没有失误。只是他太准了。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p33.webp"}, {"id": "p34", "size": "1536x1024", "lines": [{"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "神崎不会累。但他身边的人会。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "陆远，带着他跑，把他从中路拉出来。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "空出来的地方，艾尔肯去。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p34.webp"}, {"id": "p35", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第七十分钟。"}, {"type": "think", "who": "神崎凛", "side": "r", "at": "after", "text": "（第七十分钟了。他还在加速。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p35.webp"}, {"id": "p36", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第八十三分钟。周牧断球。"}], "sfx": [{"text": "嚓！", "x": 0.15, "y": 0.13, "size": 1.1, "rot": -6}], "img": "../img/9b675c109795163a404adf/p36.webp"}, {"id": "p37", "size": "1536x1024", "lines": [{"type": "shout", "who": "艾尔肯", "side": "r", "at": "after", "text": "后点！"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p37.webp"}, {"id": "p38", "size": "1536x1024", "lines": [], "sfx": [{"text": "嘭——！", "x": 0.84, "y": 0.12, "size": 1.3, "rot": 8}], "img": "../img/9b675c109795163a404adf/p38.webp"}, {"id": "p39", "size": "1536x1024", "lines": [{"type": "shout", "who": "解说", "side": "c", "at": "after", "text": "球进了！陆远！"}, {"type": "nar", "at": "after", "text": "1比1。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p39.webp"}, {"id": "p40", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "九十分钟，1比1。加时赛。"}, {"type": "say", "who": "顾长河", "side": "l", "at": "after", "text": "还有三十分钟。腿还在的，举手。"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "在。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p40.webp"}, {"id": "p41", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "加时赛下半场。第一百一十八分钟。"}, {"type": "think", "who": "神崎凛", "side": "l", "at": "after", "text": "（最后一次机会。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p41.webp"}, {"id": "p42", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（追得上！）"}], "sfx": [{"text": "嚓——！", "x": 0.84, "y": 0.13, "size": 1.2, "rot": 8}], "img": "../img/9b675c109795163a404adf/p42.webp"}, {"id": "p43", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "一百二十分钟。1比1。"}, {"type": "nar", "at": "after", "text": "点球大战。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p43.webp"}, {"id": "p44", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "所有人手搭着肩，站在中圈。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p44.webp"}, {"id": "p45", "size": "1536x1024", "lines": [{"type": "say", "who": "林晚", "side": "l", "at": "after", "text": "第三个主罚的，十次里七次踢你的左边。"}, {"type": "say", "who": "石磊", "side": "r", "at": "after", "text": "记住了。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p45.webp"}, {"id": "p46", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第一轮。日本队罚进。"}, {"type": "nar", "at": "after", "text": "艾尔肯的射门，砸在了横梁上。"}, {"type": "nar", "at": "after", "text": "0比1。中国队，落后。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p46.webp"}, {"id": "p47", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第二轮，双方都罚进。1比2。"}, {"type": "nar", "at": "before", "text": "第三轮。再丢一个，就结束了。"}, {"type": "think", "who": "石磊", "side": "c", "at": "after", "text": "（左边。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p47.webp"}, {"id": "p48", "size": "1536x1024", "lines": [{"type": "shout", "who": "解说", "side": "c", "at": "after", "text": "扑出去了！！"}, {"type": "nar", "at": "after", "text": "第三个主罚的队友稳稳罚进。2比2，追平了。"}], "sfx": [{"text": "啪——！", "x": 0.84, "y": 0.12, "size": 1.3, "rot": 6}], "img": "../img/9b675c109795163a404adf/p48.webp"}, {"id": "p49", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "第四轮。神崎凛，稳稳罚进。"}, {"type": "nar", "at": "after", "text": "周牧，同样罚进。3比3。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p49.webp"}, {"id": "p50", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "第五轮。石磊的指尖碰到了球——"}, {"type": "nar", "at": "before", "text": "球击中门柱，弹了出来。"}, {"type": "say", "who": "周牧", "side": "r", "at": "after", "text": "去吧。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p50.webp"}, {"id": "p51", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "最后一个出场的，是陆远。"}, {"type": "nar", "at": "after", "text": "罚进，就是逆转。就是八强。"}, {"type": "nar", "at": "after", "text": "全场，没有一点声音。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p51.webp"}, {"id": "p52", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "码头的小电视前，也没有人出声。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p52.webp"}, {"id": "p53", "size": "1536x1024", "lines": [{"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（十二码。比那面墙，近得多。）"}, {"type": "think", "who": "陆远", "side": "l", "at": "after", "text": "（门在这儿。）"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p53.webp"}, {"id": "p54", "size": "1024x1536", "lines": [], "sfx": [{"text": "嘭——！！", "x": 0.3, "y": 0.06, "size": 1.4, "rot": -6}], "img": "../img/9b675c109795163a404adf/p54.webp"}, {"id": "p55", "size": "1536x1024", "lines": [{"type": "shout", "who": "解说", "side": "c", "at": "after", "text": "进了——！！"}], "sfx": [{"text": "唰——！", "x": 0.82, "y": 0.13, "size": 1.3, "rot": 6}], "img": "../img/9b675c109795163a404adf/p55.webp"}, {"id": "p56", "size": "1536x1024", "lines": [{"type": "nar", "at": "after", "text": "4比3。点球大战，逆转。"}, {"type": "nar", "at": "after", "text": "中国队，历史上第一次，进入世界杯八强。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p56.webp"}, {"id": "p57", "size": "1536x1024", "lines": [{"type": "say", "who": "神崎凛", "side": "r", "at": "after", "text": "一百二十分钟。"}, {"type": "say", "who": "神崎凛", "side": "r", "at": "after", "text": "下一次，我会赢回来。"}, {"type": "say", "who": "陆远", "side": "l", "at": "after", "text": "我等着。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p57.webp"}, {"id": "p58", "size": "1536x1024", "lines": [{"type": "nar", "at": "before", "text": "大连，渔港。"}, {"type": "nar", "at": "after", "text": "墙上的粉笔球门旁边，多了许多新的球门。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p58.webp"}, {"id": "p59", "size": "1536x1024", "lines": [{"type": "say", "who": "孩子", "side": "l", "at": "after", "text": "哥哥，这个门，怎么才能踢进去？"}, {"type": "say", "who": "陆远", "side": "r", "at": "after", "text": "每天三百脚。"}, {"type": "nar", "at": "after", "text": "风还是逆着吹。"}, {"type": "nar", "at": "after", "text": "八强战，三天之后。"}], "sfx": [], "img": "../img/9b675c109795163a404adf/p59.webp"}], "hasNext": false};</script>
